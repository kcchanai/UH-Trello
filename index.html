<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f6cbd" />
  <meta name="description" content="Flowboard is a local-first project planning board." />
  <title>Flowboard — project planning</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></symbol>
    <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"></path></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.5 14.4A8.5 8.5 0 0 1 9.6 3.5 8.5 8.5 0 1 0 20.5 14.4Z"></path></symbol>
    <symbol id="icon-board" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"></rect><rect x="10" y="4" width="5" height="10" rx="1"></rect><rect x="17" y="4" width="4" height="13" rx="1"></rect></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v5M14 11v5M9 7l1-3h4l1 3M6 7l1 13h10l1-13"></path></symbol>
  </svg>

  <header class="topbar">
    <a class="brand" href="#board" aria-label="Flowboard home"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span><span>Flowboard</span></a>
    <span class="workspace">My workspace</span>
    <div class="search-wrap" role="search"><svg><use href="#icon-search"></use></svg><input id="search" type="search" placeholder="Search cards" autocomplete="off" aria-label="Search cards" /><button id="clear-search" class="clear-search" type="button" aria-label="Clear search" hidden><svg><use href="#icon-close"></use></svg></button></div>
    <button id="theme-toggle" class="icon-button top-action" type="button" aria-label="Switch to dark theme" title="Switch theme"><svg><use href="#icon-moon"></use></svg></button>
    <span class="avatar" aria-label="Signed in locally as AH">AH</span>
  </header>

  <main>
    <section class="board-header" aria-label="Board controls">
      <div class="board-heading"><svg aria-hidden="true"><use href="#icon-board"></use></svg><input id="board-title" class="board-title" aria-label="Board title" value="Website Launch" /></div>
      <output id="search-count" class="search-count" aria-live="polite"></output>
      <div class="board-actions">
        <button id="board-menu" class="button button-quiet" type="button" aria-haspopup="menu" aria-expanded="false"><svg><use href="#icon-more"></use></svg><span>Board actions</span></button>
        <div id="board-menu-panel" class="menu-panel" role="menu" hidden>
          <button type="button" role="menuitem" data-action="reset-board"><svg><use href="#icon-trash"></use></svg>Reset board</button>
        </div>
      </div>
    </section>
    <section id="board" class="board" aria-label="Project board"></section>
  </main>

  <dialog id="confirm-dialog" class="dialog">
    <form method="dialog" class="dialog-card" id="confirm-form">
      <div class="dialog-icon"><svg><use href="#icon-trash"></use></svg></div>
      <div><h2 id="confirm-title">Are you sure?</h2><p id="confirm-message">This action cannot be undone.</p></div>
      <div class="dialog-actions"><button class="button button-quiet" value="cancel">Cancel</button><button id="confirm-action" class="button button-danger" value="confirm">Delete</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Flowboard needs JavaScript enabled to save and organize cards.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
